name: Feature request
description: Suggest a focused improvement to NEXORA
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful solution and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Scope and impact
      description: Note affected users, permissions, data, deployment, or compatibility.
    validations:
      required: true
