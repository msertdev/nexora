name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Audit all dependencies against reviewed exceptions
        run: node scripts/check-dependency-audit.mjs

      - name: Validate CI and security configuration
        run: >-
          pnpm exec prettier --check
          .github/dependabot.yml
          .github/workflows/continuous-integration.yml
          scripts/check-dependency-audit.mjs
          security/audit-exceptions.json

      - name: Check API formatting
        run: pnpm --filter api exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate --config prisma7.config.ts

      - name: Lint API
        run: pnpm --filter api lint

      - name: Build API
        run: pnpm --filter api build

      - name: Test API
        run: pnpm --filter api test

      - name: Validate Prisma schema
        run: pnpm --filter api exec prisma validate --config prisma7.config.ts

      - name: Lint web
        run: pnpm --filter web lint

      - name: Type-check web
        run: pnpm --filter web check-types

      - name: Run frontend regression tests
        run: node --test apps/web/lib/*.spec.mjs

      - name: Build web
        run: pnpm --filter web build

      - name: Lint documentation site
        run: pnpm --filter docs lint

      - name: Type-check documentation site
        run: pnpm --filter docs check-types

      - name: Build documentation site
        run: pnpm --filter docs build

  docker:
    name: Docker validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate production Compose
        run: >-
          docker compose
          --env-file deploy/runtime.production.env.example
          -p nexora-ci-production
          -f compose.prod.yaml
          config --quiet

      - name: Validate local-test Compose
        run: >-
          docker compose
          --env-file deploy/runtime.local.env.example
          -p nexora-ci-local
          -f compose.prod.yaml
          -f compose.local-test.yaml
          config --quiet

      - name: Build API and migration images
        run: >-
          docker compose
          --env-file deploy/runtime.production.env.example
          -p nexora-ci-build
          -f compose.prod.yaml
          build api migrate

      - name: Build web image
        run: >-
          docker compose
          --env-file deploy/runtime.production.env.example
          -p nexora-ci-build
          -f compose.prod.yaml
          build web
