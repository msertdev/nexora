name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Validate workflow YAML
        run: pnpm exec prettier --check .github/workflows/continuous-integration.yml

      - name: Check API formatting
        run: pnpm --filter api exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint API
        run: pnpm --filter api lint

      - name: Build API
        run: pnpm --filter api build

      - name: Test API
        run: pnpm --filter api test

      - name: Validate Prisma schema
        run: pnpm --filter api exec prisma validate --config prisma7.config.ts

      - name: Lint web
        run: pnpm --filter web lint

      - name: Type-check web
        run: pnpm --filter web check-types

      - name: Run frontend regression tests
        run: node --test apps/web/lib/*.spec.mjs

      - name: Build web
        run: pnpm --filter web build

      - name: Lint documentation site
        run: pnpm --filter docs lint

      - name: Type-check documentation site
        run: pnpm --filter docs check-types

      - name: Build documentation site
        run: pnpm --filter docs build

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Validate production Compose
        run: >-
          docker compose
          --env-file deploy/runtime.production.env.example
          -p nexora-ci-production
          -f compose.prod.yaml
          config --quiet

      - name: Validate local-test Compose
        run: >-
          docker compose
          --env-file deploy/runtime.local.env.example
          -p nexora-ci-local
          -f compose.prod.yaml
          -f compose.local-test.yaml
          config --quiet

      - name: Build API and migration images
        run: >-
          docker compose
          --env-file deploy/runtime.production.env.example
          -p nexora-ci-build
          -f compose.prod.yaml
          build api migrate

      - name: Build web image
        run: >-
          docker compose
          --env-file deploy/runtime.production.env.example
          -p nexora-ci-build
          -f compose.prod.yaml
          build web
