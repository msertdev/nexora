  <circle cx="115" cy="49" r="10" fill="#37D7FF" opacity="0.18" filter="url(#node-glow)"/>
  <circle cx="115" cy="111" r="10" fill="#3478FF" opacity="0.2" filter="url(#node-glow)"/>
