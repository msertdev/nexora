<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">NEXORA logo</title>
  <desc id="desc">A connected-node N mark beside a geometric NEXORA wordmark.</desc>
  <defs>
    <linearGradient id="mark-line" x1="24" y1="32" x2="96" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37D7FF"/>
      <stop offset="1" stop-color="#3478FF"/>
    </linearGradient>
    <linearGradient id="word-line" x1="160" y1="44" x2="560" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#B9CCEB"/>
    </linearGradient>
    <filter id="node-glow" x="-80%" y="-80%" width="260%" height="260%">
