<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">NEXORA product preview</title>
  <desc id="desc">The real NEXORA issue workspace and issue detail panel, with the project name and open-source license.</desc>
  <defs>
    <linearGradient id="page-shade" x1="0" y1="320" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050812" stop-opacity="0.98"/>
      <stop offset="0.45" stop-color="#050812" stop-opacity="0.9"/>
      <stop offset="0.78" stop-color="#050812" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#050812" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge-shade" x1="640" y1="0" x2="640" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#02040B" stop-opacity="0.7"/>
      <stop offset="0.16" stop-color="#02040B" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#02040B" stop-opacity="0"/>
      <stop offset="1" stop-color="#02040B" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="electric" x1="58" y1="54" x2="488" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC74D7"/>
      <stop offset="0.5" stop-color="#9A61FF"/>
      <stop offset="1" stop-color="#61A8FF"/>
    </linearGradient>
    <linearGradient id="rule" x1="60" y1="0" x2="564" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F07BDD"/>
      <stop offset="0.5" stop-color="#9A61FF"/>
      <stop offset="1" stop-color="#61A8FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#050812"/>
  <image href="nexora-issue-detail.webp" x="0" y="0" width="1280" height="640" preserveAspectRatio="xMidYMid slice"/>
  <rect width="920" height="640" fill="url(#page-shade)"/>
  <rect width="1280" height="640" fill="url(#edge-shade)"/>
  <rect x="1" y="1" width="1278" height="638" rx="2" stroke="#C57AFF" stroke-opacity="0.32" stroke-width="2"/>

  <g transform="translate(60 54)">
    <rect width="74" height="74" rx="20" fill="#11101D" fill-opacity="0.96"/>
    <rect x="0.75" y="0.75" width="72.5" height="72.5" rx="19.25" stroke="#C77AF9" stroke-opacity="0.72" stroke-width="1.5"/>
    <path d="M19 53V21L55 53V21" stroke="url(#electric)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#11101D" stroke="url(#electric)" stroke-width="2.5">
      <circle cx="19" cy="21" r="4"/>
      <circle cx="19" cy="53" r="4"/>
      <circle cx="37" cy="37" r="4"/>
      <circle cx="55" cy="21" r="4"/>
      <circle cx="55" cy="53" r="4"/>
    </g>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="154" y="104" fill="#FFFFFF" font-size="35" font-weight="800" letter-spacing="5">NEXORA</text>
    <text x="60" y="227" fill="#FFFFFF" font-size="56" font-weight="800" letter-spacing="-2.2">Plan. Prioritize.</text>
    <text x="60" y="291" fill="#FFFFFF" font-size="56" font-weight="800" letter-spacing="-2.2">Ship together.</text>
    <text x="62" y="345" fill="#D7D2E3" font-size="23" font-weight="500">Self-hosted project and team management.</text>

    <g transform="translate(60 397)">
      <rect width="174" height="46" rx="23" fill="#141320" fill-opacity="0.92" stroke="#BE74F3" stroke-opacity="0.65"/>
      <circle cx="24" cy="23" r="5" fill="#6EE7B7"/>
      <text x="42" y="30" fill="#F0EAF8" font-size="16" font-weight="750" letter-spacing="1.2">APACHE 2.0</text>
    </g>

    <text x="60" y="511" fill="#B8AEC7" font-size="16" font-weight="700" letter-spacing="1.3">NEXT.JS · NESTJS · POSTGRESQL</text>
    <text x="60" y="557" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="0.9">github.com/msertdev/nexora</text>
  </g>

  <rect x="60" y="590" width="506" height="2" rx="1" fill="url(#rule)"/>
  <circle cx="1172" cy="545" r="42" fill="#A45FFF" opacity="0.15" filter="url(#soft-shadow)"/>
</svg>
